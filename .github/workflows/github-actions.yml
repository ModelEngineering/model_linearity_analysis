name: Continous integration
on: [push]
jobs:
  Run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
          python-version: '3.11'
    - name: Install
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    - name: Run tests
      run: |
        nose2 tests
